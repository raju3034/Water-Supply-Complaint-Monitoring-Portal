services:
  mongodb:
    image: mongo:8.0
    container_name: water-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=water_supply_portal
    volumes:
      - mongodb_data:/data/db
    networks:
      - water-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: water-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/water_supply_portal
      - JWT_SECRET=jalconnect_secure_jwt_token_secret_key_2026
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - water-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: water-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - water-network

networks:
  water-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
